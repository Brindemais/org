<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Você está offline — Brinde Mais</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #08080a;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 360px; }
      .badge {
        width: 56px; height: 56px; border-radius: 999px; margin: 0 auto 20px;
        background: linear-gradient(135deg, #f4da8c 0%, #d4941e 45%, #935915 100%);
        display: flex; align-items: center; justify-content: center;
        font-size: 26px; font-weight: 800; color: #08080a;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: rgba(8,8,10,0.55); line-height: 1.5; margin: 0 0 20px; }
      button {
        border: none; cursor: pointer; font: inherit; font-weight: 600;
        padding: 12px 20px; border-radius: 12px;
        background: linear-gradient(135deg, #f4da8c 0%, #d4941e 45%, #935915 100%);
        color: #08080a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">b</div>
      <h1>Sem conexão no momento</h1>
      <p>Não foi possível carregar esta página porque você está offline. Verifique sua internet e tente novamente.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
