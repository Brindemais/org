<!-- Assunto sugerido: Redefina sua senha na Brinde Mais -->
<div style="background-color:#f5f2ec;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background-color:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e8e4db;">
    <tr>
      <td style="height:4px;background-color:#d4941e;font-size:0;line-height:0;">&nbsp;</td>
    </tr>
    <tr>
      <td style="padding:32px 32px 8px;text-align:center;">
        <img src="https://brindemais.com.br/images/email-logo.png" alt="Brinde Mais" width="96" style="display:block;margin:0 auto;height:auto;" />
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px 0;">
        <h1 style="margin:0 0 12px;font-size:20px;color:#0A0A0A;font-family:Arial,Helvetica,sans-serif;">Redefinir senha</h1>
        <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#555555;">Recebemos um pedido para redefinir a senha da sua conta Brinde Mais. Digite o código abaixo na tela de redefinição de senha.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 8px;text-align:center;">
        <div style="background-color:#faf8f4;border:1px solid #e8e4db;border-radius:10px;padding:16px 24px;display:inline-block;">
          <span style="font-size:28px;font-weight:bold;letter-spacing:6px;color:#0A0A0A;font-family:Arial,Helvetica,sans-serif;">{{ .Token }}</span>
        </div>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 32px 32px;">
        <p style="margin:0;font-size:12px;color:#aaaaaa;border-top:1px solid #e8e4db;padding-top:16px;">Se você não solicitou esta redefinição, pode ignorar este e-mail. Sua senha atual continua valendo.</p>
        <p style="margin:8px 0 0;font-size:12px;color:#aaaaaa;">Equipe Brinde Mais &middot; brindemais.com.br</p>
      </td>
    </tr>
  </table>
</div>
